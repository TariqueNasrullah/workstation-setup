set -g mouse on
setw -g mode-keys vi

# 1. Disable the automatic copy-and-exit on mouse release
unbind-key -T copy-mode MouseDragEnd1Pane
# 1. Unbind default exit behaviors for vi mode
unbind-key -T copy-mode-vi Enter
unbind-key -T copy-mode-vi y
unbind-key -T copy-mode-vi MouseDragEnd1Pane

# Bind 'Enter' to copy to macOS clipboard, clear the highlight, and STAY in copy mode
bind-key -T copy-mode Enter send-keys -X copy-pipe "pbcopy" \; send-keys -X clear-selection

# quick reload with prefix+r
bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"
# 2. Bind both 'Enter' and 'y' to copy to macOS clipboard and STAY in copy mode
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe "pbcopy" \; send-keys -X clear-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe "pbcopy" \; send-keys -X clear-selection


# --- PLUGINS ---
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'JosephLai241/tmux-line-numbers'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

